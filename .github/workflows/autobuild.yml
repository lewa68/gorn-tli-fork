# Автосборка форка: следит за оригиналом, обновляет канал релизов.
#
# Что происходит по расписанию (и вручную кнопкой Run workflow):
#   1. Забирает оригинальный репозиторий (upstream = lanqvist/gorn-tli).
#   2. Если там новые коммиты — сливает их с фиксами форка и пушит сюда.
#   3. Считает версию форка: <версия автора>-fork.<номер сборки фиксов>.
#      Новая версия автора -> fork.1; те же фиксы дорабатываются -> fork.2, fork.3…
#   4. Если релиз с этой версией уже опубликован — работа закончена.
#   5. Иначе: проверяет типы, гоняет тесты, собирает установщик и портативную
#      версию и публикует релиз на этот канал.
#
# Установленные приложения обновляются как обычно: сами проверяют этот
# канал, сами скачивают, сами ставят. Каждая версия = официальная + фиксы.
#
# Конфликт слияния (автор поменял те же места, что и форк) останавливает
# выпуск красным прогоном — его видно во вкладке Actions, чинится руками.

name: Автосборка форка

on:
  schedule:
    # Раз в 6 часов (UTC). GitHub может сдвигать время на загруженных раннерах.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-autobuild
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: windows-latest
    steps:
      - name: Чекаут
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Слияние с оригиналом
        id: sync
        shell: pwsh
        run: |
          git config user.name 'fork-autobuild'
          git config user.email 'actions@users.noreply.github.com'
          git remote add upstream https://github.com/lanqvist/gorn-tli.git
          git fetch upstream main
          # Влит ли upstream: сравнивается merge-base с самим upstream,
          # а не HEAD — HEAD всегда содержит коммиты форка и никогда не
          # равен upstream.
          $merged = (git merge-base HEAD upstream/main) -eq (git rev-parse upstream/main)
          if ($merged) {
            "changed=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'upstream уже влит — сливать нечего.'
            exit 0
          }
          git merge upstream/main --no-edit
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::Конфликт слияния с оригиналом — правки форка и автора задели одни места. Разрешить руками: git fetch upstream main; git merge upstream/main'
            exit 1
          }
          git push origin HEAD
          "changed=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Версия форка
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $pkg = Get-Content package.json -Raw
          $current = [regex]::Match($pkg, '"version":\s*"([^"]+)"').Groups[1].Value
          $released = (gh api repos/$env:GH_REPO/releases/latest --jq .tag_name 2>$null)
          # Тег последнего релиза нужен для сравнения с HEAD; чекаут мог его
          # не принести (тег свежий) — тянем явно и тихо.
          if ($released) { git fetch origin "refs/tags/${released}:refs/tags/${released}" 2>$null | Out-Null }
          $base = $current -replace '-fork\.\d+$', ''

          # Выпущена ли уже именно эта сборка: версия та же и HEAD — это
          # коммит релизного тега. Новый фикс-коммит или влитый upstream
          # сдвигают HEAD — номер сборки растёт и в том, и в другом случае.
          $head = git rev-parse HEAD
          $releasedSha = if ($released) { (git rev-parse "$released^{commit}" 2>$null) } else { $null }
          if ($released -eq "v$current" -and "$releasedSha" -eq "$head") {
            Write-Host "Релиз v$current уже опубликован — публикации не требуется."
            "version=$current" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "publish=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          # Правки самого пайплайна (.github/**) и документации (README,
          # CHANGELOG) приложение не меняют — новая сборка на них не нужна.
          if ("$releasedSha" -ne "" -and "$releasedSha" -ne "$head") {
            $appChanged = git diff --name-only "$releasedSha..$head" |
              Where-Object { $_ -notmatch '^\.github/' -and $_ -notmatch '^(README|CHANGELOG)' }
            if (-not $appChanged) {
              Write-Host "После релиза менялись только пайплайн и документация — публикации не требуется."
              "version=$current" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
              "publish=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
              exit 0
            }
          }

          # Номер сборки: +1 к последнему релизу той же базы; новая база
          # (автор выпустил новую версию) — снова fork.1. Версию, правленную
          # в package.json руками на больший номер, уважаем.
          $n = 1
          if ($released -match '^v?(.+)-fork\.(\d+)$' -and $Matches[1] -eq $base) { $n = [int]$Matches[2] + 1 }
          if ($current -match '^v?(.+)-fork\.(\d+)$' -and $Matches[1] -eq $base) { $n = [Math]::Max($n, [int]$Matches[2]) }
          $version = "$base-fork.$n"
          Write-Host "Версия форка: $version"

          # Точечная замена строки версии: ConvertTo-Json перевёл бы
          # русские строки в \u-последовательности и переформатировал файл.
          if ($version -ne $current) {
            $pkg = $pkg -replace '"version":\s*"[^"]*"', "`"version`": `"$version`""
            Set-Content package.json $pkg -Encoding utf8 -NoNewline
            git config user.name 'fork-autobuild'
            git config user.email 'actions@users.noreply.github.com'
            git add package.json
            git commit -m "Версия форка $version"
            git push origin HEAD
          }

          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Кэш инструментов electron-builder
        # electron-builder качает nsis/winCodeSign с того же файлового
        # хостинга GitHub, что и релизы; когда он лежит (504), сборка
        # падает. Кэш прогревается первым успешным прогоном.
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-v1

      - name: Зависимости
        if: steps.ver.outputs.publish == 'true'
        run: npm ci --no-audit --no-fund

      - name: Типы
        if: steps.ver.outputs.publish == 'true'
        run: npm run typecheck

      - name: Тесты
        if: steps.ver.outputs.publish == 'true'
        run: npx vitest run --no-file-parallelism

      - name: Иконка
        if: steps.ver.outputs.publish == 'true'
        run: npm run icon

      - name: Сборка и публикация релиза
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # electron-builder упаковывает готовый dist: main/preload собирает
          # esbuild (build-electron.mjs), renderer — vite build.
          npm run build
          # Раздача инструментов с GitHub бывает лежит (504) — и electron-
          # builder умеет умирать на этом тихо, с кодом 0. Пробуем до трёх
          # раз: главный артефакт обязан существовать после сборки.
          foreach ($i in 1..3) {
            npx electron-builder --win --publish always
            if (Test-Path "release/Gorn-$env:VERSION-setup.exe") { break }
            Write-Host "::warning::Сборка не дала артефактов (попытка $i) — пауза две минуты и повтор."
            Start-Sleep -Seconds 120
          }

          # Сборка publish-ит electron-builder'ом, но финальное состояние
          # контролируем сами: с несколькими таргетами он способен оставить
          # НЕСКОЛЬКО draft-релизов тега, каждый с частью ассетов.
          $tag = "v$env:VERSION"
          $want = @(
            "Gorn-$env:VERSION-setup.exe",
            "Gorn-$env:VERSION-setup.exe.blockmap",
            "Gorn-$env:VERSION-portable.exe",
            'latest.yml'
          )
          $rels = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          $drafts = @($rels | Where-Object { $_.draft -and $_.tag_name -eq $tag })
          if ($drafts.Count -gt 0) {
            # Главный draft — самый полный; make_latest строкой: boolean API
            # молча игнорирует.
            $main = $drafts | Sort-Object { @($_.assets).Count } -Descending | Select-Object -First 1
            # make_latest работает только телом JSON: через -f поля GitHub
            # молча игнорирует, и Latest остаётся на старом релизе.
            '{"draft": false, "make_latest": "true"}' |
              gh api -X PATCH "repos/$env:GH_REPO/releases/$($main.id)" --input - | Out-Null
            Write-Host "Опубликован draft $($main.id) с @(главные ассеты: $(@($main.assets).Count))."
            foreach ($d in @($drafts | Where-Object { $_.id -ne $main.id })) {
              Write-Host "Удалён лишний draft $($d.id) (ассетов: $(@($d.assets).Count))."
              gh api -X DELETE "repos/$env:GH_REPO/releases/$($d.id)" | Out-Null
            }
          }
          # Чего не хватает — доливаем из локальной папки сборки: не важно,
          # в какой draft что залетело, итог обязан быть полным.
          $have = @(gh release view $tag --repo $env:GH_REPO --json assets -q '.assets[].name')
          foreach ($f in $want) {
            if ($have -notcontains $f) {
              $p = Join-Path 'release' $f
              if (Test-Path $p) {
                gh release upload $tag $p --repo $env:GH_REPO --clobber | Out-Null
                Write-Host "Долит из сборки: $f"
              } else {
                Write-Host "::warning::Файла нет ни в релизе, ни в сборке: $f"
              }
            }
          }
          # Контроль: опубликован и полный.
          $final = gh release view $tag --repo $env:GH_REPO --json isDraft,assets -q '{d: .isDraft, n: (.assets | length)}' | ConvertFrom-Json
          if ($final.d -or $final.n -lt $want.Count) {
            Write-Host "::error::Релиз $tag неполный (draft=$($final.d), ассетов $($final.n)/$($want.Count))."
            exit 1
          }
          Write-Host "Релиз $tag опубликован, ассетов: $($final.n)."

      - name: Заметки релиза — отличия от официальной версии
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Заметки — из CHANGELOG-fork.md: секция «## <версия>». Пишется
          # для игрока, а не git log: внутренние правки пайплайна игроку
          # не говорят ничего. Секции нет — берём весь файл: заметки
          # не должны блокировать выпуск.
          $changelog = Get-Content CHANGELOG-fork.md -Raw
          $m = [regex]::Match($changelog, "(?s)## $([regex]::Escape($env:VERSION))\s*\r?\n(.*?)(?=\r?\n## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value } else { $changelog }
          $notes.Trim() | Set-Content release-notes.txt -Encoding utf8
          # Сразу после публикации API иногда отвечает 404 на свежий релиз —
          # даём ему догнаться и пробуем несколько раз.
          $ok = $false
          foreach ($i in 1..3) {
            gh release edit "v$env:VERSION" --repo $env:GH_REPO --notes-file release-notes.txt
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Заметки не применились (попытка $i) — пауза и повтор."
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { Write-Host '::error::Не удалось обновить заметки релиза'; exit 1 }
