# Автосборка форка: следит за оригиналом, обновляет канал релизов.
#
# Что происходит по расписанию (и вручную кнопкой Run workflow):
#   1. Забирает оригинальный репозиторий (upstream = lanqvist/gorn-tli).
#   2. Если там новые коммиты — сливает их с фиксами форка и пушит сюда.
#   3. Считает версию форка: <версия автора>-fork.<номер сборки фиксов>.
#      Новая версия автора -> fork.1; те же фиксы дорабатываются -> fork.2, fork.3…
#   4. Если релиз с этой версией уже опубликован — работа закончена.
#   5. Иначе: проверяет типы, гоняет тесты, собирает установщик и портативную
#      версию и публикует релиз на этот канал.
#
# Установленные приложения обновляются как обычно: сами проверяют этот
# канал, сами скачивают, сами ставят. Каждая версия = официальная + фиксы.
#
# Конфликт слияния (автор поменял те же места, что и форк) останавливает
# выпуск красным прогоном — его видно во вкладке Actions, чинится руками.

name: Автосборка форка

on:
  schedule:
    # Раз в 6 часов (UTC). GitHub может сдвигать время на загруженных раннерах.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-autobuild
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: windows-latest
    steps:
      - name: Чекаут
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Слияние с оригиналом
        id: sync
        shell: pwsh
        run: |
          git config user.name 'fork-autobuild'
          git config user.email 'actions@users.noreply.github.com'
          git remote add upstream https://github.com/lanqvist/gorn-tli.git
          git fetch upstream main
          # Влит ли upstream: сравнивается merge-base с самим upstream,
          # а не HEAD — HEAD всегда содержит коммиты форка и никогда не
          # равен upstream.
          $merged = (git merge-base HEAD upstream/main) -eq (git rev-parse upstream/main)
          if ($merged) {
            "changed=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'upstream уже влит — сливать нечего.'
            exit 0
          }
          git merge upstream/main --no-edit
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::Конфликт слияния с оригиналом — правки форка и автора задели одни места. Разрешить руками: git fetch upstream main; git merge upstream/main'
            exit 1
          }
          git push origin HEAD
          "changed=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Версия форка
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          $pkg = Get-Content package.json -Raw
          $current = [regex]::Match($pkg, '"version":\s*"([^"]+)"').Groups[1].Value
          $released = (gh api repos/$env:GH_REPO/releases/latest --jq .tag_name 2>$null)

          if ($env:UPSTREAM_CHANGED -ne 'true') {
            # upstream не приносил ничего нового: версия из package.json
            # уже правильная (её поставил ассистент или прошлый прогон),
            # пересчитывать нечего. Публикуем, только если она ещё не вышла.
            "version=$current" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            if ($released -eq "v$current") {
              Write-Host "Релиз v$current уже опубликован — публикации не требуется."
              "publish=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            } else {
              Write-Host "Релиза v$current ещё нет — публикуем как есть."
              "publish=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
            exit 0
          }

          # Влит новый upstream: версия = <версия автора>-fork.<номер сборки>.
          $base = $current -replace '-fork\.\d+$', ''
          $n = 1
          if ($released -match '^v?(.+)-fork\.(\d+)$' -and $Matches[1] -eq $base) { $n = [int]$Matches[2] + 1 }
          $version = "$base-fork.$n"
          Write-Host "Версия форка: $version"

          # Точечная замена строки версии: ConvertTo-Json перевёл бы
          # русские строки в \u-последовательности и переформатировал файл.
          $pkg = $pkg -replace '"version":\s*"[^"]*"', "`"version`": `"$version`""
          Set-Content package.json $pkg -Encoding utf8 -NoNewline
          git config user.name 'fork-autobuild'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json
          git commit -m "Версия форка $version"
          git push origin HEAD

          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Зависимости
        if: steps.ver.outputs.publish == 'true'
        run: npm ci --no-audit --no-fund

      - name: Типы
        if: steps.ver.outputs.publish == 'true'
        run: npm run typecheck

      - name: Тесты
        if: steps.ver.outputs.publish == 'true'
        run: npx vitest run --no-file-parallelism

      - name: Иконка
        if: steps.ver.outputs.publish == 'true'
        run: npm run icon

      - name: Сборка и публикация релиза
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_DRAFT: 'false'

      - name: Заметки релиза — отличия от официальной версии
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $diff = git log --oneline --no-decorate upstream/main..HEAD |
            Where-Object { $_ -notmatch 'Версия форка' }
          @("Отличия от официальной версии:", "") + $diff | Set-Content release-notes.txt -Encoding utf8
          gh release edit "v$env:VERSION" --notes-file release-notes.txt
